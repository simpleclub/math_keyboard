name: web demo
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web_deploy.yml'
      - 'math_keyboard_demo/lib/**'
      - 'math_keyboard_demo/web/**'
      - 'math_keyboard_demo/pubspec.yaml'
      # The demo depends on the package by path, so a change to the package
      # itself changes the deployed demo and has to redeploy it.
      - 'math_keyboard/lib/**'
      - 'math_keyboard/pubspec.yaml'

jobs:
  demo-deploy:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    name: deployment of math_keyboard_demo

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build demo web app
        run: |
          cd math_keyboard_demo
          flutter pub get
          flutter build web
          cd build/web
          touch ".nojekyll"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: math_keyboard_demo/build/web
          git-config-name: simpleclub-bot
          git-config-email: developers@simpleclub.com
          commit-message: Deploy math_keyboard_demo web page
